name: corvette (一加Ace3Pro) 6.1 OKI内核

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  KERNEL_NAME: 'android14-11-o-gf421ce937631'

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库(默认cctv18=社区修复镜像,官方16代源缺kernel/oplus_cpu编不过; OnePlusOSS=官方原始源)'
        required: true
        type: choice
        default: 'cctv18'
        options:
          - 'cctv18'
          - 'OnePlusOSS'
      source_branch:
        description: '源码分支(默认=cctv18修复版oneplus12通用141,用户实测可开机; OnePlusOSS的16代分支缺oplus_cpu会编译失败; 其余为corvette官方14.1/15源,均6.1.75)'
        required: true
        type: choice
        default: 'oneplus/sm8650_b_16.0.0_oneplus12_6.1.141'
        options:
          - 'oneplus/sm8650_b_16.0.0_oneplus12_6.1.141'
          - 'oneplus/sm8650_b_16.0.0_ace_3_pro'
          - 'oneplus/sm8650_v_15.0.0_ace_3_pro'
          - 'oneplus/sm8650_u_14.1.0_oneplus_ace3pro'
      ksu_ref:
        description: 'SukiSU Ultra 源码引用(默认v4.2.1-r2=当前最新发布tag; susfs_new=7月susfs适配线; main=开发线)'
        required: true
        type: choice
        default: 'v4.2.1-r2'
        options:
          - 'v4.2.1-r2'
          - 'susfs_new'
          - 'main'
      extra_tweaks:
        description: '是否追加 KSM/ZSTD_COMPRESS/ZSTD_DECOMPRESS/KYBER(排查不开机可关, 已知可开机包无KSM/ZSTD_C)'
        required: true
        type: choice
        default: 'true'
        options: ['true','false']
      ksu_in_uname:
        description: 'uname 是否拼入 KSU 版本段(排查不开机时可关, 得到纯官方版本串)'
        required: true
        type: choice
        default: 'true'
        options: ['true','false']
      ksu_type:
        description: 'KernelSU分支(SukiSU Ultra/KernelSU Next,默认SukiSU Ultra)'
        required: true
        type: choice
        default: 'sukisu'
        options:
          - 'sukisu'
          - 'ksunext'
      hook_method:
        description: hook模式(大部分情况manual即可，若新版manual钩子出现问题可尝试syscall, 少数需切换sus su模式的场景才需要kprobes钩子)
        required: true
        type: choice
        default: 'manual'
        options:
          - 'manual'
          - 'syscall'
          - 'kprobes'
          - 'lsm'
      kpm_enable:
        description: '是否开启kpm(仅对sukisu生效; 可能轻微增加耗电，不需要可保持默认关闭)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'true'
          - 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁及 LZ4KD 补丁(0=均不安装,1=安装lz4&zstd补丁,2=安装lz4kd补丁,3=均安装,默认1)'
        required: true
        type: choice
        default: '1'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)"
        required: true
        type: choice
        default: 'default'
        options:
          - 'false'
          - 'true'
          - 'default'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      ssg_rekernel_enable:
        description: '是否启用三星SSG IO调度器及Re-Kernel支持(0=均不安装,1=安装SSG IO调度器,2=安装Re-Kernel,3=均安装,默认0)'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要可关闭)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '自定义内核署名后缀(追加在官方后缀末尾: Reirin -> uname 显示 6.1.141-android14-11-o-gf421ce937631-Reirin; 留空=不加)'
        required: false
        type: string
        default: 'Reirin'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ksublevel: ${{ steps.ccacheconf.outputs.ksublevel }}
      ksuffix: ${{ steps.makename.outputs.ksuffix }}
      ksupart: ${{ steps.makename.outputs.ksupart }}
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-Clang20工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev ccache &
          #旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）
          #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev zip unzip ccache
          
          echo "正在克隆源码仓库..." &&
          SRC_REPO="${{ github.event.inputs.source_repo }}" &&
          [ -n "$SRC_REPO" ] || SRC_REPO="cctv18" &&
          SRC_BRANCH="${{ github.event.inputs.source_branch }}" &&
          [ -n "$SRC_BRANCH" ] || SRC_BRANCH="oneplus/sm8650_b_16.0.0_oneplus12_6.1.141" &&
          aria2c -s16 -x16 -k1M "https://github.com/${SRC_REPO}/android_kernel_common_oneplus_sm8650/archive/refs/heads/${SRC_BRANCH}.zip" -o common.zip &&
          unzip -q common.zip &&
          SHADIR=$(ls -d android_kernel_common_oneplus_sm8650-* 2>/dev/null | head -1) &&
          [ -n "$SHADIR" ] &&
          mv "$SHADIR" common &&
          rm -rf common.zip &&
          echo "源码目录 $SHADIR -> common" &&
          touch /tmp/ok_src &
          
          echo "正在克隆llvm-Clang20工具链..." &&
          mkdir -p clang20 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip -o clang.zip &&
          unzip -q clang.zip -d clang20 &&
          rm -rf clang.zip &&
          touch /tmp/ok_clang &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &&
          touch /tmp/ok_bt &

          wait
          for m in /tmp/ok_src /tmp/ok_clang /tmp/ok_bt; do
            [ -f "$m" ] || { echo "!! 初始化未完成($m 缺失): 下载/解压/分支名有误, 见上方日志"; exit 1; }
          done
          echo "所有源码及llvm-Clang20工具链初始化完成！"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        id: ccacheconf
        run: |
          SRC_BRANCH="${{ github.event.inputs.source_branch }}"
          [ -n "$SRC_BRANCH" ] || SRC_BRANCH="oneplus/sm8650_b_16.0.0_oneplus12_6.1.141"
          VER_TAG=$(grep -m1 SUBLEVEL kernel_workspace/common/Makefile | awk '{print $3}')
          echo "源码分支: $SRC_BRANCH -> 内核 6.1.$VER_TAG"
          echo "ksublevel=$VER_TAG" >> $GITHUB_OUTPUT
          echo "CCACHE_TAG=6.1.$VER_TAG" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache_6.1.$VER_TAG" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：6.1.$VER_TAG (corvette/Ace3Pro)"

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CCACHE_TAG }}-corvette-${{ runner.os }}-main
          restore-keys: |
            ccache-${{ env.CCACHE_TAG }}-corvette-${{ runner.os }}-
            ccache-${{ env.CCACHE_TAG }}-corvette-
      
      - name: 初始化并配置ccache
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_HARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显示初始缓存状态
          echo "ccache初始状态:"
          ccache -s
          
          # 如果缓存恢复命中，显示详细信息
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            echo "正在配置SukiSU Ultra..."
            KSU_REF="${{ github.event.inputs.ksu_ref }}"
            [ -n "$KSU_REF" ] || KSU_REF="v4.2.1-r2"
            echo "SukiSU 源码引用: $KSU_REF"
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s "$KSU_REF"
            cd ./KernelSU
            # 获取当前 Git 提交的短哈希 (8位)
            GIT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
            echo "当前提交哈希: $GIT_COMMIT_HASH"
            export KSU_VERSION=$KSU_VERSION
            # 尝试最多 3 次获取 KernelSU API 版本号
            for i in {1..3}; do
              # 从远程 Makefile 中提取 KSU_API_VERSION
              KSU_API_VERSION=$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${KSU_REF}/kernel/Makefile" | 
                # 查找第一个包含版本定义的行
                grep -m1 "KSU_VERSION_API :=" | 
                # 提取等号后的值
                awk -F'= ' '{print $2}' | 
                # 删除所有空白字符
                tr -d '[:space:]')
              # 如果成功获取到版本号则跳出循环，否则等待 1 秒后重试
              [ -n "$KSU_API_VERSION" ] && break || sleep 1
            done
            # 如果获取失败，使用默认版本号 3.1.7
            [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="3.1.7"
            # 将 API 版本号存储到 GitHub 环境变量
            echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV
            # 创建版本定义模板&版本格式函数: 使用获取的提交哈希和固定后缀
            # KSU_VERSION_API: API 版本定义
            # KSU_VERSION_FULL: 完整版本定义
            VERSION_DEFINITIONS=$'define get_ksu_version_full\nv\\$1-'"$GIT_COMMIT_HASH"$'@cctv18\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"$'@cctv18'
            # 清理内核 Makefile 中的旧版本定义
            # 删除版本函数
            sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile
            # 删除 API 版本定义
            sed -i '/KSU_VERSION_API :=/d' kernel/Makefile
            # 删除完整版本定义
            sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile
            # 在 REPO_OWNER 行后插入新版本定义
            awk -v def="$VERSION_DEFINITIONS" '
              # 当找到 REPO_OWNER 行时，插入版本定义并设置标记
              /REPO_OWNER :=/ {print; print def; inserted=1; next}
              # 打印所有行
              1
              # 如果未找到插入点，在文件末尾追加
              END {if (!inserted) print def}
            ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile

            # 生成自定义版本号（基于提交计数）, 失败时使用 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 10700 2>/dev/null || echo 114514)
            # 存储版本号到 GitHub 环境变量
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

            # 验证修改结果
            grep -A10 "REPO_OWNER" kernel/Makefile || echo "(新版 Makefile 无 REPO_OWNER, 版本号注入已跳过, 使用自带定义)"
            grep "KSU_VERSION_FULL" kernel/Makefile || echo "(新版 Makefile 无 KSU_VERSION_FULL, 属正常)"
            echo "SukiSU版本号: v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@cctv18"
          else
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs
            cd KernelSU-Next
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=next&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 10200)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            echo "正在添加SukiSU Ultra补丁..."
            git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            git clone https://github.com/SukiSU-Ultra/SukiSU_patch.git
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            if [[ ${{ github.event.inputs.hook_method }} == "manual" ]]; then
              cp ./SukiSU_patch/hooks/scope_min_manual_hooks_v1.6.patch ./common/
            fi
            if [[ ${{ github.event.inputs.hook_method }} == "syscall" ]]; then
              cp ./SukiSU_patch/hooks/syscall_hooks.patch ./common/
            fi
            if [[ ${{ github.event.inputs.hook_method }} != "lsm" ]]; then
              cp ./SukiSU_patch/69_hide_stuff.patch ./common/
            fi
            cd ./common
            patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            if [[ ${{ github.event.inputs.hook_method }} == "manual" ]]; then
              patch -p1 < scope_min_manual_hooks_v1.6.patch || true
            fi
            if [[ ${{ github.event.inputs.hook_method }} == "syscall" ]]; then
              patch -p1 < syscall_hooks.patch || true
            fi
            if [[ ${{ github.event.inputs.hook_method }} != "lsm" ]]; then
              patch -p1 < 69_hide_stuff.patch || true
            fi
            # 复活老式 SUSFS: 新版 KSU Kconfig 已删 KSU_SUSFS 符号组, 注入官方激活补丁
            cd ../KernelSU && \
              cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./ && \
              awk '/^diff --git /{keep=($3!~/a\/kernel\/(core\/init\.c|hook\/setuid_hook\.c|manager\/pkg_observer\.c|policy\/app_profile\.[ch]|feature\/sucompat\.[ch]|sulog\/event\.[ch]|runtime\/ksud_integration\.c|runtime\/ksud\.h|preinit\/preinit\.[ch]|feature\/adb_root\.[ch])$/)} keep' 10_enable_susfs_for_ksu.patch > 10_filtered.patch && \
              { patch -p1 < 10_filtered.patch || echo "(10_enable 部分失败, 见上方)"; } && \
              cd ..
          else
            echo "正在添加KernelSU Next补丁..."
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            git clone https://github.com/WildKernels/kernel_patches.git
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            if [[ ${{ github.event.inputs.hook_method }} == "manual" ]]; then
              cp ./kernel_patches/next/scope_min_manual_hooks_v1.5.patch ./common/
            fi
            if [[ ${{ github.event.inputs.hook_method }} == "syscall" ]]; then
              cp ./kernel_patches/next/syscall_hooks.patch ./common/
            fi
            cp ./kernel_patches/69_hide_stuff.patch ./common/
            cd ./common
            patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            if [[ ${{ github.event.inputs.hook_method }} == "manual" ]]; then
              patch -p1 -N -F 3 < scope_min_manual_hooks_v1.5.patch || true
            fi
            if [[ ${{ github.event.inputs.hook_method }} == "syscall" ]]; then
              patch -p1 -N -F 3 < syscall_hooks.patch || true
            fi
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            #为KernelSU Next添加WildKSU管理器支持
            cd ./drivers/kernelsu
            wget https://github.com/WildKernels/kernel_patches/raw/refs/heads/main/next/susfs_fix_patches/v1.5.12/fix_apk_sign.c.patch
            patch -p2 -N -F 3 < fix_apk_sign.c.patch || true
          fi
          
      - name: SUSFS 符号/include 兜底(宏值源自社区完整版 susfs_def.h 与 KernelSU-Next)
        run: |
          cd kernel_workspace/common
          echo '' >> ./include/linux/susfs_def.h
          echo '/* === susfs 复活注入 === */' >> ./include/linux/susfs_def.h
          echo '#ifndef DEFAULT_KSU_MNT_ID' >> ./include/linux/susfs_def.h
          echo '#define DEFAULT_KSU_MNT_ID 2000000000ULL' >> ./include/linux/susfs_def.h
          echo '#endif' >> ./include/linux/susfs_def.h
          echo '#ifndef DEFAULT_KSU_MNT_GROUP_ID' >> ./include/linux/susfs_def.h
          echo '#define DEFAULT_KSU_MNT_GROUP_ID 5000' >> ./include/linux/susfs_def.h
          echo '#endif' >> ./include/linux/susfs_def.h
          echo '#ifndef VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT' >> ./include/linux/susfs_def.h
          echo '#define VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT 0x80000000' >> ./include/linux/susfs_def.h
          echo '#endif' >> ./include/linux/susfs_def.h
          echo '#ifndef CL_COPY_MNT_NS' >> ./include/linux/susfs_def.h
          echo '#define CL_COPY_MNT_NS BIT(25)' >> ./include/linux/susfs_def.h
          echo '#endif' >> ./include/linux/susfs_def.h
          echo '#include <linux/jump_label.h>' >> ./include/linux/susfs_def.h
          echo 'extern bool susfs_is_current_ksu_domain(void);' >> ./include/linux/susfs_def.h
          echo 'extern bool susfs_is_current_proc_umounted(void);' >> ./include/linux/susfs_def.h
          echo 'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;' >> ./include/linux/susfs_def.h
          # ksu.h 原生声明被 10_enable 改动挤掉, 补回
          grep -q 'extern bool ksu_late_loaded' ./drivers/kernelsu/include/ksu.h 2>/dev/null || echo 'extern bool ksu_late_loaded;' >> ./drivers/kernelsu/include/ksu.h
          # 链接期修复 v2
          # 1) 10_enable 的 Kbuild hunk 误删原生 hook obj 行, 补回
          grep -q 'hook/syscall_hook_manager.o' ./drivers/kernelsu/Kbuild || {
            echo '' >> ./drivers/kernelsu/Kbuild
            echo '# === Kbuild 自愈: 10_enable 误删的原生 hook obj 行补回 ===' >> ./drivers/kernelsu/Kbuild
            echo 'kernelsu-objs += hook/lsm_hook.o' >> ./drivers/kernelsu/Kbuild
            echo 'kernelsu-objs += hook/syscall_event_bridge.o' >> ./drivers/kernelsu/Kbuild
            echo 'kernelsu-objs += hook/syscall_hook_manager.o' >> ./drivers/kernelsu/Kbuild
            echo 'kernelsu-objs += hook/tp_marker.o' >> ./drivers/kernelsu/Kbuild
            echo 'ifeq ($(CONFIG_ARM64),y)' >> ./drivers/kernelsu/Kbuild
            echo 'kernelsu-objs += hook/arm64/patch_memory.o' >> ./drivers/kernelsu/Kbuild
            echo 'kernelsu-objs += hook/arm64/syscall_hook.o' >> ./drivers/kernelsu/Kbuild
            echo 'endif' >> ./drivers/kernelsu/Kbuild
          }
          # 2) 真空缺符号 stub(定义在被滤段且原生无实现, 空转即正确行为)
          grep -q 'ksu_syscall_table_stub_marker' ./drivers/kernelsu/core/init.c 2>/dev/null || {
            echo '/* ksu_syscall_table_stub_marker */' >> ./drivers/kernelsu/core/init.c
            echo '#include <linux/jump_label.h>' >> ./drivers/kernelsu/core/init.c
            echo 'DEFINE_STATIC_KEY_TRUE(ksu_is_input_hook_enabled);' >> ./drivers/kernelsu/core/init.c
            echo 'void ksu_handle_vfs_fstat(void) {}' >> ./drivers/kernelsu/core/init.c
            # 50_add 内核侧调用点(老API名)的空实现: 新版KSU用自己的hook体系, 这些路径本就是死路径
            # C 链接按符号名解析, 无参定义与调用方声明不冲突
            for fn in 'int ksu_handle_execveat(void) { return 0; }' 'void ksu_handle_sys_read(void) {}' 'int ksu_handle_faccessat(void) { return 0; }' 'int ksu_handle_stat(void) { return 0; }' 'int ksu_setup_preinit_file(void) { return 0; }' 'int ksu_preinit_handle_post_execveat(void) { return 0; }' 'int ksu_handle_post_execveat_sucompat(void) { return 0; }' 'DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);'; do
              echo "$fn" >> ./drivers/kernelsu/core/init.c
            done
            echo '#include <linux/static_key.h>' >> ./drivers/kernelsu/core/init.c
          }
          # bridge.c 的 setresuid 声明修复(10_enable 删了头文件声明, 直接插 extern)
          grep -q 'int ksu_handle_setresuid' ./drivers/kernelsu/hook/syscall_event_bridge.c || {
            L=$(grep -n '^#include' ./drivers/kernelsu/hook/syscall_event_bridge.c | tail -1 | cut -d: -f1)
            [ -n "$L" ] && sed -i "${L}a extern int ksu_handle_setresuid(uid_t old_uid, uid_t new_uid);" ./drivers/kernelsu/hook/syscall_event_bridge.c && echo "bridge.c 已插入 setresuid extern 声明"
          } || true
          # 3) 移除上一版与原生定义重复的 stub 行
          sed -i '/syscall_fn_t \*ksu_syscall_table = NULL;/d; /void ksu_syscall_table_hook/d; /void ksu_syscall_table_unhook/d; /void ksu_clear_task_tracepoint_flag_if_needed/d' ./drivers/kernelsu/core/init.c 2>/dev/null || true
          for f in $(grep -rlE 'SUSFS_IS_INODE|DEFAULT_KSU_MNT|VFSMOUNT_MNT_FLAGS_KSU|susfs_is_current_ksu_domain|susfs_is_current_proc_umounted|susfs_is_sdcard_android_data|CL_COPY_MNT_NS' --include='*.c' . 2>/dev/null); do
            grep -q 'susfs_def.h' "$f" || {
              L=$(grep -n '^#include' "$f" | tail -1 | cut -d: -f1)
              [ -n "$L" ] && sed -i "${L}a #include <linux/susfs_def.h>" "$f" && echo "补 include(置于末尾): $f"
            }
          done
          echo "--- 兜底完成 ---"

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        run: |
          if [[ "${{ github.event.inputs.lz4_enable }}" == "1" || "${{ github.event.inputs.lz4_enable }}" == "3" ]]; then
            echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
            cd kernel_workspace
            git clone https://github.com/cctv18/oppo_oplus_realme_sm8650.git
            cp ./oppo_oplus_realme_sm8650/zram_patch/001-lz4.patch ./common/
            cp ./oppo_oplus_realme_sm8650/zram_patch/lz4armv8.S ./common/lib
            cp ./oppo_oplus_realme_sm8650/zram_patch/002-zstd.patch ./common/
            cd ./common
            git apply -p1 < 001-lz4.patch || true
            patch -p1 < 002-zstd.patch || true
          fi

      - name: 应用 lz4kd 补丁
        run: |
          if [[ "${{ github.event.inputs.lz4_enable }}" == "2" || "${{ github.event.inputs.lz4_enable }}" == "3" ]]; then
            echo "正在添加lz4kd补丁…"
            cd kernel_workspace
            if [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
              git clone https://github.com/SukiSU-Ultra/SukiSU_patch.git
            fi
            cd common
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
            cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
            patch -p1 -F 3 < lz4kd.patch || true
          fi
          
      - name: 添加KSU & SUSFS 配置项
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' && ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          if [ "${{ github.event.inputs.hook_method }}" == "kprobes" ]; then
