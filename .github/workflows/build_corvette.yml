            echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_KPROBES_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
          elif [ "${{ github.event.inputs.hook_method }}" == "lsm" ]; then
            echo "正在开启LSM钩子(对齐已知可开机包: KSU_LSM_HOOKS+MANUAL_SU, 不打源码hook补丁)..."
            echo "CONFIG_KSU_LSM_HOOKS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_MANUAL_SU=y" >> ./common/arch/arm64/configs/gki_defconfig
